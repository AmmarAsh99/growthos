apiVersion: apps/v1
kind: Deployment
metadata:
  name: growthos-deployment
  labels:
    app: growthos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: growthos
  template:
    metadata:
      labels:
        app: growthos
    spec:
      containers:
        - name: growthos
          image: growthos:1.14.2
          ports:
            - containerPort: 80
