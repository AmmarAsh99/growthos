# Copy to k8s/secrets.yaml (ignored by Git) and replace every placeholder locally.
# stringData is plaintext input; Kubernetes base64 encoding is not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: growthos
type: Opaque
stringData:
  POSTGRES_USER: growthos
  POSTGRES_PASSWORD: REPLACE_WITH_DATABASE_PASSWORD
  POSTGRES_DB: growthos
  DATABASE_URL: postgresql://growthos:REPLACE_WITH_URL_ENCODED_PASSWORD@postgres:5432/growthos
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  namespace: growthos
type: Opaque
stringData:
  JWT_ACCESS_SECRET: REPLACE_WITH_RANDOM_ACCESS_SECRET_AT_LEAST_32_CHARACTERS
  JWT_REFRESH_SECRET: REPLACE_WITH_DIFFERENT_RANDOM_REFRESH_SECRET_AT_LEAST_32_CHARACTERS
