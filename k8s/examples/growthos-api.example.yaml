# Copy to k8s/growthos-api.yaml and replace placeholders before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: growthos-api-deployment
  labels:
    app: growthos-api
  namespace: growthos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: growthos-api
  template:
    metadata:
      labels:
        app: growthos-api
    spec:
      containers:
        - name: growthos-api
          image: YOUR_DOCKERHUB_USERNAME/growthos-backend:YOUR_IMAGE_TAG
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: JWT_REFRESH_SECRET
            - name: CORS_ORIGIN
              value: https://growthos.example.com
            - name: COOKIE_SECURE
              value: 'true'
            - name: NODE_ENV
              value: production
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: growthos
spec:
  selector:
    app: growthos-api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
