name: growthos-stack
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-growthos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-growthos}
    volumes: ['growthos-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: build }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-growthos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-growthos}
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-growthos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-growthos}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${COMPOSE_ORIGIN:-http://localhost:8080}
      # METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # OTEL_ENABLED: ${OTEL_ENABLED:-false}
      # OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
    expose: ['3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    init: true
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  growthos-data:
