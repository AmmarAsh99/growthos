name: GrowthOS CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: growthos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: growthos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U growthos -d growthos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://growthos:ci-only-password@localhost:5432/growthos_test
      TEST_DATABASE_URL: postgresql://growthos:ci-only-password@localhost:5432/growthos_test
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      CORS_ORIGIN: http://localhost:4200
      COOKIE_SECURE: false
      OTEL_ENABLED: false
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start real browser-test servers
        run: |
          node apps/api/dist/main.js > /tmp/growthos-api.log 2>&1 &
          npm run dev -w apps/web > /tmp/growthos-web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:4200 >/dev/null && break; sleep 2; done
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:4200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-artifacts
          path: test-results/
