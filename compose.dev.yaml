name: growthos
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-growthos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-growthos}
      POSTGRES_DB: ${POSTGRES_DB:-growthos}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['growthos-dev:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  growthos-dev:
